name: Build plugin

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore packages
        run: dotnet restore Jellyfin.Plugin.MediaBackdropAnimations.slnx

      - name: Check client-script syntax
        run: node --check Jellyfin.Plugin.MediaBackdropAnimations/Web/backdrop-slideshow.js

      - name: Build plugin
        run: dotnet build Jellyfin.Plugin.MediaBackdropAnimations.slnx --configuration Release --no-restore

      - name: Stage installable plugin
        shell: pwsh
        run: |
          ./scripts/package-plugin-archive.ps1 `
            -OutputZip artifact/MediaBackdropAnimations-ci.zip `
            -InputFiles `
              Jellyfin.Plugin.MediaBackdropAnimations/bin/Release/net10.0/Jellyfin.Plugin.MediaBackdropAnimations.dll, `
              Jellyfin.Plugin.MediaBackdropAnimations/bin/Release/net10.0/Jellyfin.Plugin.MediaBackdropAnimations.xml

      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MediaBackdropAnimations
          path: artifact/MediaBackdropAnimations-ci.zip
          if-no-files-found: error
